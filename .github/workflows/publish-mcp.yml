name: Publish to npm and the MCP Registry

on:
  push:
    tags: ["v*"] # e.g. v1.1.0

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC auth to the MCP Registry
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24" # trusted publishing needs Node >= 22.14 and npm >= 11.5.1
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in release builds

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Keep server.json in step with the tag (the tag is the source of truth).
      - name: Sync version into server.json
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          node -e "const fs=require('fs');const p='server.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.argv[1];j.packages[0].version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');" "$VERSION"
          echo "server.json version: $VERSION"

      - name: Publish package to npm (trusted publishing / OIDC)
        # No NPM_TOKEN: npm exchanges the GitHub OIDC token automatically.
        # Requires a Trusted Publisher configured on npmjs.com for this repo +
        # workflow filename (see docs/publishing.md).
        #
        # Idempotent: if the tag's version is already on npm (e.g. a re-run after
        # the MCP Registry step failed), skip the publish so the remaining steps
        # can still run instead of failing with EPUBLISHCONFLICT.
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          if npm view "ai-host-optimizer@${VERSION}" version >/dev/null 2>&1; then
            echo "ai-host-optimizer@${VERSION} is already published — skipping npm publish."
          else
            npm publish --access public
          fi

      # The MCP Registry verifies ownership via the `mcpName` marker inside the
      # *published* npm package, so the version must be visible on npm before the
      # registry step runs — otherwise it fails with a spurious "not found".
      - name: Wait for the npm version to propagate
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          for attempt in $(seq 1 30); do
            if npm view "ai-host-optimizer@${VERSION}" version >/dev/null 2>&1; then
              echo "ai-host-optimizer@${VERSION} is visible on npm."
              exit 0
            fi
            echo "waiting for npm to serve ${VERSION} (attempt ${attempt}/30)..."
            sleep 5
          done
          echo "timed out waiting for npm to serve ${VERSION}" >&2
          exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to the MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to the MCP Registry
        run: ./mcp-publisher publish
